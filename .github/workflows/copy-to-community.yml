name: Copy Last Commit to PMC Community

on:
  workflow_dispatch:

jobs:
  copy-last-commit:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v6
        with:
          repository: PMCDevOnlineServices/ihs-hubspot
          ref: main

      - name: Prepare destination repository
        run: |
          git config --global user.name "florinhoinarescu"
          git config --global user.email "florin_hoinarescu@yahoo.com"

          git clone https://github.com/pmc-community/hs-cms-modules.git ../destination-repo

          cd ../destination-repo
          git checkout -B main

      - name: Copy last commit content
        env:
          DESTINATION_TOKEN: ${{ secrets.PAT_TO_COPY_TO_COMMUNITY }}
        run: |
          # Copy source repository content to destination
          rsync -a --exclude='.git' ./ ../destination-repo/

          cd ../destination-repo

          git add -A

          git commit \
            -m "Sync last commit from main branch of PMCDevOnlineServices/ihs-hubspot" \
            || echo "Nothing to commit"

          # Configure authenticated remote
          git remote set-url origin \
            "https://x-access-token:${DESTINATION_TOKEN}@github.com/pmc-community/hs-cms-modules.git"

          git push -f origin main

      - name: Clean up
        if: always()
        run: |
          rm -rf ../destination-repo